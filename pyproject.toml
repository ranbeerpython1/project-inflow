[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "project-inflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
